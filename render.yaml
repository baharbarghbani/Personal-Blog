services:
  - type: web
    name: bahar-academic-portfolio
    runtime: python
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: ./build.sh
    startCommand: ./start.sh
    healthCheckPath: /
    disk:
      name: media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: personal-blog-database
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_SSL_REQUIRE
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: MEDIA_ROOT
        value: /opt/render/project/src/media
      - key: MEDIA_URL
        value: /media/
      - key: SERVE_MEDIA
        value: "True"
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_USE_SSL
        value: "False"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false

databases:
  - name: personal-blog-database
    databaseName: personal_blog
    user: personal_blog
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
