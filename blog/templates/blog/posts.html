{% extends "base.html" %}
{% block body %}
    {% for post in posts_list %}
        {% include "blog/post_card.html" with post=post %}
    {% empty %}
        <div class="container posts-empty-state">
            <h1>No published posts yet</h1>
            <p>New writing will appear here after it is published.</p>
        </div>
    {% endfor %}
{% endblock %}
