{% extends "base.html" %}
{% block body %}
<div class="container form-card" >
    <form method="POST">
        {% csrf_token %}
        <!-- {{ form.as_p }} as_p in Django is a built-in method of a Django form object that tells Django to render each field wrapped in a <p> tag. -->
        {% for field in form %}
            <div class="form-row">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                <div class="form-input">
                    {{ field }}
                    {% if field.help_text %} <small class="form-help">{{ field.help_text}}</small> {% endif %}
                    {% for error in field.errors %} <div class="form-error">
                        {{ error }}
                    </div> {% endfor%}
                </div>
            </div>
        {% endfor %}
        <div class="form-submit">
            <button type="submit" class="form-btn">Send</button>
        </div>
    </form>
</div>
{% endblock %}
